plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
    id 'de.maxhenkel.cursegradle' version "${cursegradle_version}"
    id 'com.modrinth.minotaur' version "${minotaur_version}"
    id 'com.gradleup.shadow' version "${shadow_version}"
    id 'mod-update' version "${mod_update_version}"
}

apply from: "https://raw.githubusercontent.com/henkelmax/mod-gradle-scripts/${mod_gradle_script_version}/mod.gradle"

repositories {
    maven { url = 'https://modmaven.dev' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation "de.maxhenkel.corelib:corelib:${corelib_version}+${minecraft_version}:api"
    testImplementation "net.neoforged:testframework:${neoforge_version}"
    compileOnly "maven.modrinth:jei:${jei_version}"
    compileOnly "maven.modrinth:the-one-probe:${theoneprobe_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}"
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:additions"
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:generators"
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:tools"

    shadow "de.maxhenkel.corelib:corelib:${corelib_version}+${minecraft_version}:api"
    runtimeOnly "de.maxhenkel.corelib:corelib:${corelib_version}+${minecraft_version}"
    compileOnly "de.maxhenkel.corelib:corelib:${corelib_version}+${minecraft_version}:javadoc"
}

neoForge {
    unitTest {
        enable()
        testedMod = mods.pipez
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    filesMatching('**/*.toml') {
        expand 'mod_version': mod_version,
                'neoforge_dependency': neoforge_dependency,
                'minecraft_version': minecraft_version,
                'mekanism_dependency': mekanism_dependency,
                'minecraft_dependency': minecraft_dependency
    }
}

shadowJar {
    relocate 'de.maxhenkel.corelib', 'de.maxhenkel.pipez.corelib'
}

sourceSets {
    main {
        java {
            // TODO Add back Mekanism
            exclude 'de/maxhenkel/pipez/utils/GasUtils.java'
            exclude 'de/maxhenkel/pipez/integration/*/**'
        }
    }
}
